[project]
name = "flow-dictate"
version = "0.1.0"
description = "Scaffold for a macOS dictation daemon."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
flow-dictate = "flow_dictate.cli:main"

[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flow_dictate"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.9.0",
]
